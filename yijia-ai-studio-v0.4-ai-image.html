<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>億家 AI Studio v0.4</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{margin:0;background:#0d0f0e;color:#f5f7f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}button,input,textarea,select{font:inherit}.app{max-width:900px;margin:auto;padding:18px 14px 80px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:900;background:linear-gradient(135deg,#ff8a00,#fff 50%,#38b66a);color:#111}.panel,.scene{background:#151916;border:1px solid #2c332e;border-radius:16px;padding:16px;margin-bottom:12px}.muted{color:#929b95;font-size:13px}textarea,input,select{width:100%;background:#0f1210;border:1px solid #343b36;color:#fff;border-radius:9px;padding:10px}textarea{min-height:78px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}button{border:1px solid #343b36;background:#1b201c;color:#fff;border-radius:9px;padding:11px}.primary{background:#52c675;color:#07120a;border-color:#52c675;font-weight:800}.hidden{display:none}.status{padding:10px;border-radius:9px;background:#17231b;color:#aee6bb;margin-top:10px}.error{background:#2b1818;color:#ffb9b9}.scene label{display:block;color:#a0a8a2;font-size:12px;margin:10px 0 5px}.preview{height:170px;background:#0a0c0b;border-radius:10px;display:grid;place-items:center;overflow:hidden;margin-bottom:10px}.preview img{width:100%;height:100%;object-fit:cover}.timeline{display:flex;gap:5px;overflow:auto}.clip{min-width:70px;background:#284f34;border:1px solid #3d6948;border-radius:8px;padding:9px;display:flex;justify-content:space-between}.projectItem{border:1px solid #303832;border-radius:10px;padding:10px;margin-top:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}.mini{padding:9px 10px;font-size:14px}.aiBar{display:flex;gap:8px;margin-top:8px}.imgStatus{margin-top:8px;color:#9bd8a9;font-size:12px}.imgError{color:#ffb9b9}.loading{opacity:.7;pointer-events:none}@media(min-width:700px){#scenes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scene{margin:0}}
</style></head><body><div class="app">
<div class="brand"><div class="mark">億</div><div><h2 style="margin:0">億家 AI Studio</h2><div class="muted">v0.4 Supabase 雲端同步＋AI 生圖版</div></div></div>

<div class="panel"><h3>Supabase 連線設定</h3><p class="muted">貼上你自己的 Project URL 與 Publishable key。只會儲存在這支瀏覽器。</p><input id="sbUrl" placeholder="https://xxxx.supabase.co"><input id="sbKey" placeholder="sb_publishable_..." style="margin-top:8px"><div class="row" style="margin-top:8px"><button class="primary" onclick="saveConfig()">儲存並連線</button><button onclick="clearConfig()">清除</button></div><div id="setupStatus" class="status hidden"></div></div>

<div class="panel"><div id="signedOut"><h3>登入 / 註冊</h3><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="密碼" style="margin-top:8px"><div class="row" style="margin-top:8px"><button class="primary" onclick="signIn()">登入</button><button onclick="signUp()">註冊</button></div><p class="muted">若 Confirm email 有開啟，第一次註冊後要先到信箱確認。</p></div><div id="signedIn" class="hidden"><strong id="userEmail"></strong><div class="row" style="margin-top:8px"><button onclick="signOut()">登出</button></div></div><div id="authStatus" class="status hidden"></div></div>

<div id="cloudPanel" class="panel hidden"><h3>雲端專案</h3><div class="row"><button class="primary" onclick="saveCloud()">☁️ 儲存到雲端</button><button onclick="newProject()">＋ 新專案</button><button onclick="loadCloud()">重新整理</button></div><div id="projectList"></div></div>

<div class="panel"><h1 style="font-size:25px">一句話建立影片分鏡</h1><input id="projectName" value="我的 AI 影片" placeholder="專案名稱"><textarea id="topic" placeholder="例如：橘貓店長早上打開億家超商，整理貨架，熊貓店員跑進來上班。" style="margin-top:8px"></textarea><div class="row" style="margin-top:8px"><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option></select><button class="primary" onclick="generate()">✨ 產生腳本與分鏡</button></div></div>

<div class="panel row"><button onclick="addScene()">＋ 新增場景</button><button onclick="speakAll()">🔊 旁白預覽</button><button onclick="saveLocal(true)">💾 本機儲存</button></div>
<div id="scenes"></div>
<div class="panel"><h3>時間軸</h3><div id="timeline" class="timeline"></div></div>
<div class="panel"><h3>影片輸出</h3><p class="muted">目前已支援本機儲存、Supabase 雲端專案、登入、分鏡、旁白、字幕、圖片與時間軸。</p><button onclick="downloadProject()">📦 匯出專案 JSON</button></div>
</div>
<script>
const LOCAL='yijia-ai-v04',CFG='yijia-ai-sb';
let state={cloudId:null,name:'我的 AI 影片',topic:'',ratio:'9:16',scenes:[]},sb=null,user=null;
const $=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
function status(id,msg,err=false){const e=$(id);e.textContent=msg;e.className='status'+(err?' error':'');setTimeout(()=>e.className='status hidden',3500)}
function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function saveConfig(){const url=$('sbUrl').value.trim(),key=$('sbKey').value.trim();if(!url||!key)return status('setupStatus','請填完整',true);localStorage.setItem(CFG,JSON.stringify({url,key}));initSB()}
function clearConfig(){localStorage.removeItem(CFG);sb=null;user=null;$('sbUrl').value='';$('sbKey').value='';updateAuth()}
async function initSB(){const c=JSON.parse(localStorage.getItem(CFG)||'null');if(!c){updateAuth();return;}$('sbUrl').value=c.url;$('sbKey').value=c.key;try{sb=supabase.createClient(c.url,c.key);const {data:{session}}=await sb.auth.getSession();user=session?.user||null;sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;updateAuth();if(user)loadCloud()});updateAuth();if(user)loadCloud();status('setupStatus','Supabase 已連線')}catch(e){status('setupStatus',e.message,true)}}
function updateAuth(){const y=!!user;$('signedOut').classList.toggle('hidden',y);$('signedIn').classList.toggle('hidden',!y);$('cloudPanel').classList.toggle('hidden',!y);if(y)$('userEmail').textContent=user.email}
async function signUp(){if(!sb)return status('authStatus','請先連線 Supabase',true);const {data,error}=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value});if(error)return status('authStatus',error.message,true);status('authStatus',data.session?'註冊成功':'註冊成功，請到信箱確認 Email')}
async function signIn(){if(!sb)return status('authStatus','請先連線 Supabase',true);const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return status('authStatus',error.message,true);user=data.user;updateAuth();loadCloud();status('authStatus','登入成功')}
async function signOut(){if(sb)await sb.auth.signOut();user=null;updateAuth()}
function makeScene(t,i){return{id:uid(),title:'場景 '+(i+1),duration:4,narration:t,subtitle:t,visualPrompt:t+'，電影感構圖，柔和光線，乾淨細節，適合 '+$('ratio').value+' 短影音',motion:i%2?'輕微橫移':'慢慢推近',image:null,imagePrompt:'',imageLoading:false,imageError:''}}
function sync(){state.name=$('projectName').value||'我的 AI 影片';state.topic=$('topic').value;state.ratio=$('ratio').value}
function generate(){const t=$('topic').value.trim();if(!t)return alert('請先輸入影片主題');const a=t.split(/[，。！？,.!?]/).map(x=>x.trim()).filter(Boolean),src=a.length?a:[t],n=Math.min(Math.max(src.length,4),8);state.scenes=Array.from({length:n},(_,i)=>makeScene(src[i%src.length],i));state.cloudId=null;saveLocal();render()}
function addScene(){state.scenes.push(makeScene('',state.scenes.length));saveLocal();render()}
function update(id,k,v){const s=state.scenes.find(x=>x.id===id);if(s){s[k]=k==='duration'?Math.max(1,Number(v)||1):v;if(['title','narration','visualPrompt'].includes(k)){s.imagePrompt=s.visualPrompt||s.narration||s.title}saveLocal();renderTimeline()}}
function del(id){state.scenes=state.scenes.filter(x=>x.id!==id);saveLocal();render()}
function upload(id,f){if(!f)return;const r=new FileReader();r.onload=e=>{update(id,'image',e.target.result);render()};r.readAsDataURL(f)}
function saveLocal(show=false){sync();localStorage.setItem(LOCAL,JSON.stringify(state));if(show)alert('已儲存在這支手機')}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(LOCAL)||'null');if(x)state=x}catch(e){}$('projectName').value=state.name;$('topic').value=state.topic;$('ratio').value=state.ratio}
function newProject(){state={cloudId:null,name:'我的 AI 影片',topic:'',ratio:'9:16',scenes:[]};$('projectName').value=state.name;$('topic').value='';$('ratio').value='9:16';saveLocal();render();$('projectName').scrollIntoView({behavior:'smooth',block:'start'})}
function render(){const b=$('scenes');b.innerHTML='';if(!state.scenes.length)b.innerHTML='<div class="panel" style="text-align:center"><h3>還沒有分鏡</h3><div class="muted">先輸入故事並產生分鏡。</div></div>';state.scenes.forEach((s,i)=>{const e=document.createElement('div');e.className='scene'+(s.imageLoading?' loading':'');const imgPrompt=esc(s.imagePrompt||s.visualPrompt||s.narration||'');e.innerHTML=`<div class="preview">${s.image?`<img src="${s.image}">`:'🖼️ 場景圖片'}</div><input value="${esc(s.title)}" onchange="update('${s.id}','title',this.value)"><label>上傳場景圖片</label><input type="file" accept="image/*" onchange="upload('${s.id}',this.files[0])"><div class="aiBar"><button class="primary mini" onclick="generateSceneImage('${s.id}')">✨ AI 產生圖片</button><button class="mini" onclick="clearSceneImage('${s.id}')">清除圖片</button></div><div class="imgStatus ${s.imageError?'imgError':''}">${esc(s.imageError || (s.imageLoading?'AI 產圖中，請稍候…':''))}</div><label>旁白</label><textarea onchange="update('${s.id}','narration',this.value)">${esc(s.narration)}</textarea><label>畫面提示詞</label><textarea onchange="update('${s.id}','visualPrompt',this.value)">${esc(s.visualPrompt)}</textarea><label>本次生圖提示詞</label><textarea onchange="update('${s.id}','imagePrompt',this.value)">${imgPrompt}</textarea><label>運鏡</label><input value="${esc(s.motion)}" onchange="update('${s.id}','motion',this.value)"><label>秒數</label><input type="number" min="1" value="${s.duration}" onchange="update('${s.id}','duration',this.value)"><label>字幕</label><textarea onchange="update('${s.id}','subtitle',this.value)">${esc(s.subtitle)}</textarea><button style="margin-top:8px" onclick="del('${s.id}')">刪除場景</button>`;b.appendChild(e)});renderTimeline()}
function renderTimeline(){const t=$('timeline');t.innerHTML=state.scenes.length?'':'<span class="muted">新增場景後會顯示時間軸。</span>';state.scenes.forEach((s,i)=>{const d=document.createElement('div');d.className='clip';d.innerHTML='<b>'+(i+1)+'</b><span>'+s.duration+'s</span>';t.appendChild(d)})}
function speakAll(){if(!('speechSynthesis'in window))return alert('瀏覽器不支援');speechSynthesis.cancel();const text=state.scenes.map(s=>s.narration).filter(Boolean).join('。');if(!text)return alert('沒有旁白');const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';speechSynthesis.speak(u)}
function downloadProject(){saveLocal();const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(state.name||'project')+'.json';a.click()}
function clearSceneImage(id){const s=state.scenes.find(x=>x.id===id);if(!s)return;s.image=null;s.imageError='';s.imageLoading=false;saveLocal();render()}
async function generateSceneImage(id){if(!sb)return alert('請先在上方輸入 Supabase URL 與 Key，並按「儲存並連線」');const s=state.scenes.find(x=>x.id===id);if(!s)return;const prompt=(s.imagePrompt||s.visualPrompt||s.narration||s.title||'').trim();if(!prompt)return alert('這個場景沒有可用的提示詞');s.imageLoading=true;s.imageError='';saveLocal();render();try{const {data,error}=await sb.functions.invoke('generate-image',{body:{prompt}});if(error)throw error;if(!data?.ok||!data?.image_data_url)throw new Error(data?.error||'沒有收到圖片資料');s.image=data.image_data_url;s.imagePrompt=prompt;s.imageLoading=false;s.imageError='';saveLocal();render()}catch(err){s.imageLoading=false;s.imageError='產圖失敗：'+(err?.message||String(err));saveLocal();render();alert(s.imageError+'\n\n如果持續失敗，請到 Edge Function 的 Settings 把 Verify JWT 關掉再試一次。')}}
async function saveCloud(){if(!sb||!user)return alert('請先登入');sync();const p={user_id:user.id,name:state.name,topic:state.topic,ratio:state.ratio,data:{scenes:state.scenes}};const r=state.cloudId?await sb.from('projects').update({...p,updated_at:new Date().toISOString()}).eq('id',state.cloudId).select().single():await sb.from('projects').insert(p).select().single();if(r.error)return alert(r.error.message);state.cloudId=r.data.id;saveLocal();loadCloud();alert('已同步到 Supabase')}
async function loadCloud(){if(!sb||!user)return;const {data,error}=await sb.from('projects').select('*').order('updated_at',{ascending:false});const list=$('projectList');list.innerHTML='';if(error){list.innerHTML='<div class="muted">'+esc(error.message)+'</div>';return}if(!data?.length){list.innerHTML='<div class="muted">目前沒有雲端專案。</div>';return}data.forEach(p=>{const item=document.createElement('div');item.className='projectItem';const info=document.createElement('div');info.innerHTML='<strong>'+esc(p.name||'未命名')+'</strong><div class="muted">'+esc(p.topic||'')+'</div>';const actions=document.createElement('div');actions.style.display='flex';actions.style.gap='6px';const openBtn=document.createElement('button');openBtn.type='button';openBtn.textContent='開啟';openBtn.addEventListener('click',()=>openCloud(p.id));const deleteBtn=document.createElement('button');deleteBtn.type='button';deleteBtn.textContent='刪除';deleteBtn.addEventListener('click',()=>deleteCloud(p.id));actions.append(openBtn,deleteBtn);item.append(info,actions);list.appendChild(item)})}
async function openCloud(id){if(!sb||!user){alert('請先登入');return}const {data,error}=await sb.from('projects').select('*').eq('id',id).single();if(error){alert('開啟失敗：'+error.message);return}state={cloudId:data.id,name:data.name||'我的 AI 影片',topic:data.topic||'',ratio:data.ratio||'9:16',scenes:data.data?.scenes||[]};$('projectName').value=state.name;$('topic').value=state.topic;$('ratio').value=state.ratio;saveLocal();render();alert('雲端專案已開啟');$('projectName').scrollIntoView({behavior:'smooth',block:'start'})}
async function deleteCloud(id){if(!confirm('確定刪除？'))return;const {error}=await sb.from('projects').delete().eq('id',id);if(error)return alert(error.message);if(String(state.cloudId)===String(id))state.cloudId=null;loadCloud()}
$('projectName').onchange=()=>saveLocal();$('topic').onchange=()=>saveLocal();$('ratio').onchange=()=>saveLocal();
loadLocal();render();initSB();
</script></body></html>
