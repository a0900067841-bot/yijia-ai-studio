<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>億家 AI Studio</title>
<style>
body{margin:0;background:#0d0f0e;color:#f5f7f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}button,input,textarea,select{font:inherit}
.app{max-width:900px;margin:auto;padding:18px 14px 70px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:900;background:linear-gradient(135deg,#ff8a00,#fff 50%,#38b66a);color:#111}
.panel,.scene{background:#151916;border:1px solid #2c332e;border-radius:16px;padding:16px;margin-bottom:12px}
textarea,input,select{width:100%;background:#0f1210;border:1px solid #343b36;color:#fff;border-radius:9px;padding:10px}
textarea{min-height:78px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
button{border:1px solid #343b36;background:#1b201c;color:#fff;border-radius:9px;padding:11px}
.primary{background:#52c675;color:#07120a;border-color:#52c675;font-weight:800}.muted{color:#929b95;font-size:13px}
.scene label{display:block;color:#a0a8a2;font-size:12px;margin:10px 0 5px}.sceneHead{display:flex;gap:8px}.sceneHead input{flex:1}
.preview{height:170px;background:#0a0c0b;border-radius:10px;display:grid;place-items:center;overflow:hidden;margin-bottom:10px}.preview img{width:100%;height:100%;object-fit:cover}
.timeline{display:flex;gap:5px;overflow:auto}.clip{min-width:70px;background:#284f34;border:1px solid #3d6948;border-radius:8px;padding:9px;display:flex;justify-content:space-between}
@media(min-width:700px){#scenes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scene{margin:0}}
</style>
</head>
<body>
<div class="app">
<div class="brand"><div class="mark">億</div><div><h2 style="margin:0">億家 AI Studio</h2><div class="muted">手機網頁版 v0.2</div></div></div>

<div class="panel">
<h1 style="font-size:25px">一句話建立影片分鏡</h1>
<p class="muted">先完成腳本、分鏡、旁白、字幕與畫面提示詞。</p>
<textarea id="topic" placeholder="例如：橘貓店長早上打開億家超商，整理貨架，熊貓店員跑進來上班。"></textarea>
<div class="row" style="margin-top:9px">
<select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option></select>
<button class="primary" onclick="generate()">✨ 產生腳本與分鏡</button>
</div>
</div>

<div class="panel row">
<button onclick="addScene()">＋ 新增場景</button>
<button onclick="speakAll()">🔊 旁白預覽</button>
<button onclick="save()">💾 儲存</button>
</div>

<div id="scenes"></div>

<div class="panel"><h3>時間軸</h3><div class="timeline" id="timeline"></div></div>
<div class="panel"><h3>影片輸出</h3><p class="muted">目前先完成手機版製作介面。真正 AI 圖片、圖片轉影片、AI 配音與 MP4 輸出會在下一階段串接。</p><button onclick="downloadProject()">📦 匯出專案 JSON</button></div>
</div>
<script>
const KEY='yijia-ai-studio-v2';
let state={topic:'',ratio:'9:16',scenes:[]};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function makeScene(text,i){return{id:uid(),title:'場景 '+(i+1),duration:4,narration:text,subtitle:text,visualPrompt:text+'，電影感構圖，柔和光線，乾淨細節，適合 '+document.getElementById('ratio').value+' 短影音',motion:i%2?'輕微橫移':'慢慢推近',image:null}}
function generate(){
 const topic=document.getElementById('topic').value.trim(); if(!topic){alert('請先輸入影片主題');return}
 const parts=topic.split(/[，。！？,.!?]/).map(x=>x.trim()).filter(Boolean); const src=parts.length?parts:[topic];
 const n=Math.min(Math.max(src.length,4),8); state.scenes=Array.from({length:n},(_,i)=>makeScene(src[i%src.length],i)); save();render()
}
function addScene(){state.scenes.push(makeScene('',state.scenes.length));save();render()}
function update(id,k,v){const s=state.scenes.find(x=>x.id===id);if(!s)return;s[k]=k==='duration'?Math.max(1,Number(v)||1):v;save();renderTimeline()}
function del(id){state.scenes=state.scenes.filter(x=>x.id!==id);save();render()}
function upload(id,file){if(!file)return;const r=new FileReader();r.onload=e=>{update(id,'image',e.target.result);render()};r.readAsDataURL(file)}
function save(){state.topic=document.getElementById('topic').value;state.ratio=document.getElementById('ratio').value;localStorage.setItem(KEY,JSON.stringify(state))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)state=x}catch(e){}document.getElementById('topic').value=state.topic||'';document.getElementById('ratio').value=state.ratio||'9:16'}
function render(){
 const box=document.getElementById('scenes');box.innerHTML='';
 if(!state.scenes.length) box.innerHTML='<div class="panel" style="text-align:center"><h3>還沒有分鏡</h3><div class="muted">先輸入故事並產生分鏡。</div></div>';
 state.scenes.forEach((s,i)=>{const el=document.createElement('div');el.className='scene';el.innerHTML=
 `<div class="preview">${s.image?`<img src="${s.image}">`:'🖼️ 場景圖片'}</div>
 <div class="sceneHead"><input value="${esc(s.title)}" onchange="update('${s.id}','title',this.value)"><button onclick="del('${s.id}')">刪除</button></div>
 <label>上傳場景圖片</label><input type="file" accept="image/*" onchange="upload('${s.id}',this.files[0])">
 <label>旁白</label><textarea onchange="update('${s.id}','narration',this.value)">${esc(s.narration)}</textarea>
 <label>畫面提示詞</label><textarea onchange="update('${s.id}','visualPrompt',this.value)">${esc(s.visualPrompt)}</textarea>
 <div class="row"><div><label>運鏡</label><input value="${esc(s.motion)}" onchange="update('${s.id}','motion',this.value)"></div><div><label>秒數</label><input type="number" min="1" value="${s.duration}" onchange="update('${s.id}','duration',this.value)"></div></div>
 <label>字幕</label><textarea onchange="update('${s.id}','subtitle',this.value)">${esc(s.subtitle)}</textarea>`;
 box.appendChild(el)});renderTimeline()
}
function renderTimeline(){const t=document.getElementById('timeline');t.innerHTML=state.scenes.length?'':'<span class="muted">新增場景後會顯示時間軸。</span>';state.scenes.forEach((s,i)=>{const d=document.createElement('div');d.className='clip';d.innerHTML='<b>'+(i+1)+'</b><span>'+s.duration+'s</span>';t.appendChild(d)})}
function speakAll(){if(!('speechSynthesis'in window)){alert('瀏覽器不支援語音預覽');return}speechSynthesis.cancel();const text=state.scenes.map(s=>s.narration).filter(Boolean).join('。');if(!text){alert('沒有旁白內容');return}const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';speechSynthesis.speak(u)}
function downloadProject(){save();const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='yijia-ai-project.json';a.click()}
load();render();
</script>
</body></html>
